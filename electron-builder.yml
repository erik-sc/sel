# Packaging (electron-builder). `npm run pack` = unpacked app in release/, `npm run dist` = installer.
# No code signing (only Electron fuses, below), and nothing is uploaded: `npm run dist` passes `--publish never` (see RELEASING in README.md).
# The icon is build/icon.ico, rendered from build/icon.svg.
appId: app.sel
productName: sel

directories:
  output: release

# Package the Electron that is installed (the one the app is developed and tested with)
# instead of downloading a second copy.
electronDist: node_modules/electron/dist

# Chromium ships ~55 locale .pak files; keep the two the app is used in.
electronLanguages:
  - en-US
  - pt-BR

# better-sqlite3 13 is an N-API addon that ships prebuilt binaries: nothing to compile.
npmRebuild: false
nodeGypRebuild: false

asar: true
# A native module cannot be loaded from inside the archive. Only the binary is unpacked.
asarUnpack:
  - node_modules/better-sqlite3/prebuilds/*.node

# Electron fuses: switches written into sel.exe at packaging time, which nothing at run time can
# flip back (release 0.7.0, item 6). Check them with `npx @electron/fuses read --app release/win-unpacked/sel.exe`.
electronFuses:
  # On: sel runs its own executable as Node for the tools script mcp.js, which serves Herman's tools
  # (src/main/ai/toolhost.ts) and the apps the user connects (src/main/external/snippets.ts); in
  # development also for a script AI program or transcription program (src/main/ai/command.ts,
  # src/main/meetings/whisper/run.ts). Those children get allow-listed environments, without
  # NODE_OPTIONS, and no --inspect. Anyone who can start sel.exe as Node can run any script with it,
  # and Node's --inspect flags still work in that mode: that is what keeping this fuse costs.
  runAsNode: true
  # The cookie store is encrypted with the OS key store.
  enableCookieEncryption: true
  # The app ignores NODE_OPTIONS and Node's --inspect / --inspect-brk flags (NODE_OPTIONS also in the
  # Node children). Chromium's --remote-debugging-port is a different switch and still works.
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # app.asar must match the hash electron-builder embeds in sel.exe, and the app is loaded only from it.
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

compression: maximum
# Where updates come from (the opt-in check in the app, src/main/updates). With this, a build writes
# `resources/app-update.yml` into the app and `latest.yml` next to the installer: electron-updater
# reads the first to find the releases and the second, attached to a release, to learn its version
# and the installer's SHA-512. Building never uploads anything.
publish:
  provider: github
  owner: erik-sc
  repo: sel
  releaseType: release

# main, preload and renderer are bundled into out/. The packages needed at run time are
# better-sqlite3 and electron-updater (see `dependencies` in package.json; the updater is plain
# JavaScript, loaded only when an update check runs), and of better-sqlite3 only its JavaScript and the
# binary for the platform being packaged: no SQLite sources, no build files, no other
# platforms' binaries, and not node-addon-api (C++ headers used to compile it).
files:
  - out/**
  - package.json
  - "!**/*.map"
  - "!**/*.{md,markdown,ts,tsbuildinfo}"
  - "!node_modules/node-addon-api/**"
  - "!node_modules/better-sqlite3/{deps,src,build}/**"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/better-sqlite3/prebuilds/**"
  - node_modules/better-sqlite3/prebuilds/${platform}-${arch}.node
  # Per-platform entry points of better-sqlite3 that are never required (lib/index.js picks the binary).
  - "!node_modules/better-sqlite3/lib/{darwin,linux,linuxmusl,win32}-*.js"

win:
  target:
    - target: nsis
      arch: x64

nsis:
  # Installs for the current user (under %LOCALAPPDATA%\Programs), without a UAC prompt.
  oneClick: true
  artifactName: sel-${version}-setup.${ext}
  perMachine: false
  allowElevation: false
  # The user's notes live in %APPDATA%\sel and are never removed by the uninstaller.
  deleteAppDataOnUninstall: false
  # Writes the installer's `.blockmap`, so that an update downloads only the blocks that changed
  # (electron-updater falls back to the whole installer without it).
  differentialPackage: true
