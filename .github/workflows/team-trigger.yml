# Wakes the sel team when Érik comments on a pull request, so he does not wait for the nightly run.
#
# Fires the "sel team nightly" scheduled task through its API trigger (claude.ai/code/routines →
# the task → API trigger). Two repository secrets come from there:
#   SEL_TEAM_FIRE_URL    the trigger's URL (…/v1/claude_code/routines/<id>/fire)
#   SEL_TEAM_FIRE_TOKEN  the trigger's token
# Without them the job does nothing.
#
# Only comments by erik-sc count, and never the team's own: the team posts under Érik's account
# and signs every body with <!-- sel-team -->, which would otherwise wake it in a loop.
# A run already going holds the team's lock, so a second comment during it waits for the next run.
name: Team trigger

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: team-trigger
  cancel-in-progress: false

jobs:
  fire:
    if: >-
      github.event.sender.login == 'erik-sc' &&
      (github.event_name == 'pull_request_review' || github.event.issue.pull_request) &&
      !contains(github.event.comment.body || github.event.review.body || '', '<!-- sel-team -->')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the team
        env:
          FIRE_URL: ${{ secrets.SEL_TEAM_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.SEL_TEAM_FIRE_TOKEN }}
        run: |
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then
            echo "SEL_TEAM_FIRE_URL or SEL_TEAM_FIRE_TOKEN not set; nothing to do."
            exit 0
          fi
          text=$(jq -r '
            "Woken by Érik on PR #\(.issue.number // .pull_request.number): \(.comment.html_url // .review.html_url)\n\n"
            + (.comment.body // .review.body // "")' "$GITHUB_EVENT_PATH")
          jq -n --arg text "$text" '{text: $text}' > body.json
          curl -sS --fail-with-body -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data @body.json
