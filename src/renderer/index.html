<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Selida</title>
    <!--
      Deny by default. Scripts only from the bundle; inline styles are needed by React and
      the appearance editor. Images may be local (selida-file:, data:, blob:) or remote over
      https (image blocks, bookmarks, covers) - the main process additionally cancels every
      other network request and strips cookies and referrers (src/main/security.ts).
      Audio is local only: the recordings of meetings, served by the main process (selida-file:).
      The recorder's AudioWorklet is a file of the bundle, covered by script-src 'self'.
      `connect-src` is relaxed for the dev server only, by electron.vite.config.ts.
      frame-ancestors and sandbox cannot be set from a meta tag; the page is loaded from
      file://, where there are no response headers to carry them.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: selida-file:; font-src 'self' data:; connect-src 'none'; media-src selida-file:; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
